name = "betwithfriends-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"
compatibility_flags = ["nodejs_compat"]

[vars]
APP_URL = "http://localhost:3000"
# Sender address; must be on a domain verified in Resend.
EMAIL_FROM = "noreply@betwithfriends.fun"
# Set the API key as a secret: `cd worker && npx wrangler secret put RESEND_API_KEY`
# For local dev, add RESEND_API_KEY to worker/.dev.vars (gitignored).

[[d1_databases]]
binding = "DB"
database_name = "betwithfriends"
database_id = "75789eae-d657-4600-8edb-4990f0ec126b"

[triggers]
# Every minute: pre-game bet reminders (DB-only) + score sync (only fires an API
# call when a match is in its 105 min–6h post-kickoff scoring window).
crons = ["* * * * *"]

[dev]
port = 8787
local_protocol = "http"

[observability]
enabled = true

[observability.logs]
invocation_logs = true
